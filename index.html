<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovuchivu ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family: 'Segoe UI', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation:float 6s linear infinite;
}
@keyframes float{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-120vh);opacity:0;}
}

.box{
    width:340px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
    padding:20px;
    text-align:center;
}

h2{ color:#ff3366; }

button{
    padding:10px 22px;
    border:none;
    border-radius:25px;
    font-size:15px;
    margin:8px;
    cursor:pointer;
}
.yes{background:#ff3366;color:white;}
.no{background:#ccc;}

.letter{
    max-height:360px;
    overflow-y:auto;
    text-align:left;
    font-size:14px;
    line-height:1.6;
}

audio{display:none;}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="khulta_kali_khulena.mp3" type="audio/mpeg">
</audio>

<div id="box" class="box">
  <h2>❤️ Sovuchivu ❤️</h2>
  <p>Tap to open my heart 💌</p>
</div>

<script>
const box = document.getElementById("box");

function heart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(heart,500);

box.onclick = ()=>{
  box.innerHTML=`
  <h2>Will you be my Valentine? ❤️</h2>
  <button class="yes" onclick="p1()">YES</button>
  <button class="no">NO</button>`;
};

Koeii apasai kitana pyar karta hai suchate suchte hi kho jana<br>

<button class="yes" onclick="p2()">YES</button>

</script>

</body>
</html>

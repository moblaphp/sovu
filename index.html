<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sovuchivu ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:'Segoe UI', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation:float 6s linear infinite;
    pointer-events:none;
}
@keyframes float{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-120vh);opacity:0;}
}

.box{
    width:350px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,.3);
    padding:20px;
    text-align:center;
    z-index:5;
}

h2{ color:#ff3366; }

button{
    padding:10px 22px;
    border:none;
    border-radius:25px;
    font-size:15px;
    margin:8px;
    cursor:pointer;
}
.yes{background:#ff3366;color:white;}
.no{background:#ccc;}

.letter{
    max-height:360px;
    overflow-y:auto;
    text-align:left;
    font-size:14px;
    line-height:1.6;
}
audio{display:none;}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="khulta_kali_khulena.mp3" type="audio/mpeg">
</audio>

<div id="box" class="box">
  <h2>❤️ Sovuchivu ❤️</h2>
  <p>Tap to open my heart 💌</p>
</div>

<script>
const box = document.getElementById("box");

/* floating hearts */
function heart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(heart,500);

/* start */
box.onclick = ()=>{
  poem1();
};

/* POEM 1 */
function poem1(){
box.innerHTML=`
<div class="letter">
Uski aankhon mein dekh kar<br>
kuch alag hi sukoon milta hai,<br>
jo shabdon mein bayaan nahi hota…<br><br>

Khud ko samjhate-samjhate<br>
usi ki sochon mein kho jaati hoon,<br>
ye ehsaas bhi lafzon ka mohtaaj nahi hota…<br><br>

Uski pagalpanti meri rooh ko sukoon deti hai,<br>
uska pyaar bhara gale lagna<br>
meri saari thakaan mita deta hai…<br><br>

Paas hoke bhi door rehna,<br>
door hoke bhi paas mehsoos hona,<br>
shayad isi ka naam pyaar hai…<br><br>

Kya yahi pyaar hai?<br>
Agar hai…<br>
toh ye bhi shabdon mein bayaan nahi hota ❤️
</div>
<button class="yes" onclick="p1()">Continue ❤️</button>`;
}

/* VALENTINE */
function p1(){
box.innerHTML=`
<h2>Will you be my Valentine? ❤️</h2>
<button class="yes" onclick="p2()">YES</button>
<button class="no">NO</button>`;
}

/* POEM 2 */
function p2(){
box.innerHTML=`
<div class="letter">
Dole ughadatanch tula shodhte,<br>
jag yetach tulach athavte…<br><br>

Tujhya ek message ne<br>
man kasa shant hota,<br>
phone vajla ki sagla visarta…<br><br>

Tula pahila ki kay hota te kalat nahi,<br>
pan man matr khup khush hota…<br><br>

Tu majya javal nasta tari<br>
tujhyashi n bolta rahavat nahi…<br><br>

Tuji athvan matra khup satavte 💔
</div>
<h3>You miss me? 🥺</h3>
<button class="yes" onclick="p3()">YES</button>
<button class="no">NO</button>`;
}

/* POEM 3 */
function p3(){
box.innerHTML=`
<div class="letter">
Dur rahun hi paas rahna,<br>
pura din tujhyat rahna…<br><br>

Tula gale lagavasa vatna,<br>
tujha haath pakdavasa vatna,<br>
ani tula khup jorat kiss karavasa vatna…<br><br>

Kay aahe he kalat nahi,<br>
pan man matr sangta —<br>
ha pyaar aahe ❤️
</div>
<h3>Do you love me? ❤️</h3>
<button class="yes" onclick="final()">YES</button>
<button class="no">NO</button>`;
}

/* FINAL */
function final(){
box.innerHTML=`
<h2>❤️ I LOVE YOU TOO ❤️</h2>
<p>
Sovuuuu… soveee…<br><br>
My baby boy 💕<br>
maj bal ❤️<br>
maj hatti bal <br>
maji cutiii sovu 💖<br><br>
Forever — Soham 💞
</p>`;
}
</script>

</body>
</html>
